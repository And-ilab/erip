upstream erip_backend {
    server backend:8000;
    keepalive 16;
}

upstream erip_gateway {
    server gateway:8001;
    keepalive 8;
}

server {
    listen 80;
    client_max_body_size 50m;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    open_file_cache max=1000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:7711; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'self' blob: *; frame-ancestors 'none'; base-uri 'self'" always;

    location ^~ /api/ {
        proxy_pass http://erip_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /admin/ {
        proxy_pass http://erip_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
    }

    location ^~ /static/ {
        proxy_pass http://erip_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location ^~ /media/ {
        alias /var/media/;
        default_type application/octet-stream;
    }

    # Векторная подложка. Range-запросы PMTiles нельзя сжимать.
    location ^~ /maps/ {
        alias /usr/share/nginx/html/maps/;
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Accept-Ranges bytes always;
    }

    location ^~ /gw/ {
        proxy_pass http://erip_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_read_timeout 120s;
    }

    # /ie-sign/ без хеша в имени. Общий expires на *.js держал бы старый скрипт 30 дней.
    location ^~ /ie-sign/ {
        root /usr/share/nginx/html;
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2)$ {
        root /usr/share/nginx/html;
        expires 30d;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
