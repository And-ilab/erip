line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[lint.flake8-bugbear]
# Depends/Body в значениях по умолчанию — штатный механизм DI FastAPI
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body"]

[lint.isort]
known-first-party = ["app", "apps", "config"]

[lint.per-file-ignores]
"**/migrations/*" = ["E", "F", "I", "UP"]
