<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>ЕРИП — подпись комплекта</title>
  <link rel="stylesheet" href="ie-sign.css?v=20261102c" />
  <script type="text/javascript" src="avcmxwebp.js?v=20261102c"></script>
  <script type="text/javascript" src="ie-sign.js?v=20261102c"></script>
</head>
<body>
  <!-- width/height > 0: в IE нулевой object иногда не активирует ActiveX -->
  <object id="oavcmx" type="application/x-avcmx-web-plugin" classid="CLSID:35B35038-9C01-5D75-943F-5A19E32AC230" width="1" height="1">
    <param name="onload" value="onPluginLoaded" />
  </object>

  <div class="page">
    <h1>Подпись комплекта для нотариата</h1>
    <p class="lead">Подпишите документы. Если спросят пароль ключа, введите его. Когда архив будет готов, вернитесь в программу.</p>

    <div id="status" class="status">Загрузка…</div>

    <div id="meta" class="meta" style="display:none;">
      <div>Дело: <b id="claim-id"></b></div>
      <div>ЛС: <b id="account"></b></div>
      <div>Должник: <b id="debtor"></b></div>
      <div>Сотрудник: <b id="user"></b></div>
    </div>

    <div id="plugin-box" class="box" style="display:none;">
      <label for="cert-select">Сертификат</label>
      <select id="cert-select"></select>
    </div>

    <div id="docs-box" class="box" style="display:none;">
      <h2>Документы комплекта</h2>
      <table id="docs-table">
        <thead>
          <tr>
            <th>Документ</th>
            <th>Кто подписывает</th>
            <th>Подпись</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="actions">
        <button type="button" id="btn-sign-pending" onclick="signPending();">Подписать ещё раз</button>
        <button type="button" id="btn-reload" onclick="reloadSession();">Обновить список</button>
      </div>
      <p id="work" class="work"></p>
    </div>
  </div>
</body>
</html>
