services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/ais_3nf.sql:/docker-entrypoint-initdb.d/02-ais_3nf.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - "../Примеры данных:/data/ais_spec:ro"
    expose:
      - "8000"

  gateway:
    build: ./gateway
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "8001"

  # NGINX раздаёт собранный Angular и проксирует /api/ -> backend, /gw/ -> gateway
  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
      - gateway
    ports:
      - "8080:80"

volumes:
  pgdata:
