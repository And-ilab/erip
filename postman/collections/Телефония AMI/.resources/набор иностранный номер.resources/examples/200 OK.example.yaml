$kind: http-example
name: '200 OK'
request:
  method: POST
  url: '{{base_url}}/gw/v1/voice/dial'
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "phone": "+491511234567",
          "status": "bad_number",
          "error": "Не номер +375",
          "duration_sec": 0,
          "listen_percent": null,
          "provider_message_id": "voice-0123456789ab",
          "external_call": false,
          "caller_id": "",
          "recording_ref": ""
        },
        "meta": {"request_id": "req", "duration_ms": 1}
      }
