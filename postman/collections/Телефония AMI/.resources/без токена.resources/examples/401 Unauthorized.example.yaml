$kind: http-example
name: '401 Unauthorized'
request:
  method: POST
  url: '{{base_url}}/gw/v1/voice/dial'
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "unauthorized",
          "message": "Нужен заголовок X-Internal-Token",
          "details": null,
          "request_id": "req"
        }
      }
