$kind: http-request
method: POST
url: '{{base_url}}/gw/v1/voice/dial'
order: 3000
headers:
  - key: X-Internal-Token
    value: '{{internal_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "+375291112200",
      "text": "Долг"
    }
examples: './.resources/набор неверный номер.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const data = pm.response.json().data;
      const mode = pm.collectionVariables.get('voice_mode') || 'stub';
      pm.test('200', function () { pm.response.to.have.status(200); });
      if (mode === 'ami') {
          pm.test('AMI вернул исход', function () {
              pm.expect(['answered', 'no_answer', 'busy', 'bad_number']).to.include(data.status);
              pm.expect(data.external_call).to.eql(true);
          });
      } else {
          pm.test('заглушка: неверный номер', function () {
              pm.expect(data.status).to.eql('bad_number');
              pm.expect(data.error).to.eql('Неверный номер');
              pm.expect(data.external_call).to.eql(false);
          });
      }
