$kind: http-request
method: POST
url: '{{base_url}}/gw/v1/voice/dial'
order: 10000
headers:
  - key: X-Internal-Token
    value: '{{internal_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "phone": "+375291112233"
    }
examples: './.resources/без текста и ролика.resources/examples'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('422', function () {
          pm.response.to.have.status(422);
          pm.expect(pm.response.json().error.code).to.eql('validation_error');
      });
