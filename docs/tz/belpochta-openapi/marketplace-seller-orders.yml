security:
  -
    bearerAuth: {  }
components:
  schemas:
    FullOrder:
      type: object
      allOf:
        -
          $ref: '#/components/schemas/Order'
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/OrderProduct'
    Order:
      type: object
      properties:
        id:
          type: integer
          example: 2832
          nullable: false
        status:
          type: string
          nullable: false
          enum:
            - created
            - in_progress
            - completed
            - cancelled
        created_at:
          type: string
          format: datetime
          nullable: false
          example: 1736858103
        processing_expired_at:
          type: string
          format: datetime
          nullable: true
          example: 1736858103
        count_items:
          type: integer
          example: 1
        total:
          type: object
          properties:
            amount:
              type: integer
              example: 80788
            currency:
              type: string
              enum:
                - BYN
        payment_method:
          type: string
          enum:
            - card
            - erip
            - transfer
            - upon_receipt
            - bank_loan
            - gift_card
        shipping_method:
          type: string
          enum:
            - pickup_parcel_locker
            - pickup_postal_office
            - pickup_seller
            - courier_belpost
            - courier_seller
        delivery_place:
          type: string
          nullable: true
          example: '220025, ГОРОД МИНСК, ПРОЕЗД СЛОБОДСКОЙ ДОМ 128 КВАРТИРА 33'
        buyer:
          $ref: '#/components/schemas/Buyer'
        payment:
          type: string
          enum:
            - upon_receipt
            - required
            - paid
            - cancelled
        shipping_status:
          type: string
          enum:
            - not_formed
            - formed
            - ready_for_pickup
            - on_the_road
            - issued
            - in_progress
            - returned
            - cancelled
        note:
          type: string
          nullable: true
        processed_at:
          type: string
          nullable: true
          example: '2024-03-01T00:00:00Z'
        receipt_download_url:
          type: string
          nullable: false
        finished_at:
          type: string
          format: datetime
          nullable: true
          example: 1736858103
        customer_id:
          type: integer
          nullable: false
        address_id:
          type: integer
          nullable: false
        missed_at:
          type: string
          format: datetime
          nullable: true
          example: 1736858103
    OrderListEntry:
      type: object
      description: 'Заказ в списке `GET /api/partner/v1/orders`.'
      properties:
        id:
          type: integer
          nullable: false
          example: 25230
        status:
          type: string
          nullable: false
          enum:
            - created
            - in_progress
            - completed
            - cancelled
        created_at:
          type: string
          format: date-time
          nullable: false
          example: '2026-07-22T10:18:10.000000Z'
        processing_expired_at:
          type: string
          format: date-time
          nullable: true
          description: 'Срок, до которого продавец должен взять заказ в работу. Заполнен только для заказа в статусе `created`.'
          example: '2026-07-22T11:18:10.000000Z'
        count_items:
          type: integer
          nullable: false
          description: 'Количество единиц товара во всех позициях заказа'
          example: 4
        unprocessed_count:
          type: integer
          nullable: false
          description: 'Количество единиц товара в позициях, ещё не добавленных в отправление'
          example: 0
        total:
          $ref: '#/components/schemas/Money'
        shipping_cost:
          $ref: '#/components/schemas/Money'
        subtotal:
          allOf:
            -
              $ref: '#/components/schemas/Money'
          description: 'Стоимость товаров — `total` без `shipping_cost`'
        payment_method:
          type: string
          nullable: false
          enum:
            - card
            - erip
            - transfer
            - upon_receipt
            - bank_loan
            - gift_card
            - oplati
        shipping_method:
          type: string
          nullable: false
          enum:
            - pickup_parcel_locker
            - pickup_postal_office
            - pickup_seller
            - courier_belpost
            - courier_seller
        delivery_place:
          type: string
          nullable: false
          description: 'Адрес доставки; пустая строка, если адреса нет'
          example: '220025, ГОРОД МИНСК, ПРОЕЗД СЛОБОДСКОЙ ДОМ 128 КВАРТИРА 33'
        buyer:
          allOf:
            -
              $ref: '#/components/schemas/Buyer'
          nullable: true
          description: 'Получатель заказа. Заполнен только для заказов в статусах `in_progress` и `completed`.'
        product_attributes:
          type: array
          nullable: true
          description: 'Различные `product_attribute` позиций заказа; `null`, если ни у одной позиции его нет'
          items:
            type: string
          example:
            - delivered_paid
            - canceled_by_seller_no_refund
        product_attributes_labels:
          type: array
          nullable: true
          description: 'Подписи к `product_attributes` на языке из `Accept-Language`'
          items:
            type: string
          example:
            - 'Вручен, оплачен'
        items:
          type: array
          nullable: false
          description: "Позиции заказа, по одной записи на позицию, в порядке добавления в заказ.\nОдин товар может встречаться несколько раз, если позиция была разделена\n(например, часть количества отменена): у каждой записи своё количество\nи свой `product_attribute`.\n"
          items:
            $ref: '#/components/schemas/OrderListItem'
        payment:
          type: string
          nullable: false
          enum:
            - upon_receipt
            - required
            - paid
            - cancelled
        shipping_status:
          type: string
          nullable: false
          description: 'Статус последней отправки заказа; `not_formed`, если отправок нет'
          enum:
            - not_formed
            - formed
            - ready_for_pickup
            - on_the_road
            - issued
            - in_progress
            - returned
            - cancelled
        note:
          type: string
          nullable: true
        processed_at:
          type: string
          format: date-time
          nullable: true
          description: 'Когда продавец взял заказ в работу'
          example: '2026-07-22T10:28:14.000000Z'
        receipt_download_url:
          type: string
          nullable: true
          description: 'Ссылка на чек; `null` для заказов в статусах `created` и `cancelled` и пока чека нет'
        finished_at:
          type: string
          format: date-time
          nullable: true
          example: '2026-07-25T06:50:24.000000Z'
        customer_id:
          type: integer
          nullable: false
          description: 'ID покупателя'
          example: 5751
        address_id:
          type: integer
          nullable: true
          description: 'ID адреса доставки'
          example: 8680
        missed_at:
          type: string
          format: date-time
          nullable: true
          description: 'Когда заказ был пропущен продавцом (не взят в работу вовремя)'
        payment_comment:
          type: string
          nullable: true
          description: 'Комментарий к смене статуса оплаты'
        invoice_note:
          type: object
          nullable: true
          description: 'Счёт-фактура по заказу'
          properties:
            id:
              type: integer
            status:
              type: string
              enum:
                - new
                - in_progress
                - done
                - error
        pickup_deadline:
          type: string
          format: date-time
          nullable: true
          description: 'Срок хранения в пункте выдачи по последней отправке'
          example: '2026-07-27T10:18:10+00:00'
        delivery_deadline:
          type: string
          format: date-time
          nullable: true
          description: 'Ожидаемая дата доставки по последней отправке'
          example: '2026-07-24T10:18:10+00:00'
        cancellation:
          type: object
          nullable: true
          description: 'Данные отмены. Заполнены только для отменённого заказа.'
          properties:
            initiator:
              type: string
              enum:
                - user
                - seller
                - admin
            reason:
              type: string
              nullable: true
              description: 'Название причины на языке из `Accept-Language`'
            type:
              type: string
              enum:
                - manual
                - automatic
            cancelled_at:
              type: string
              format: date-time
              example: '2026-07-22T12:00:00+00:00'
            comment:
              type: string
              nullable: true
    Money:
      type: object
      description: 'Сумма в копейках'
      properties:
        amount:
          type: integer
          example: 34700
        currency:
          type: string
          enum:
            - BYN
    OrderListItem:
      type: object
      description: 'Позиция заказа. Данные товара — на момент оформления заказа.'
      properties:
        id:
          type: integer
