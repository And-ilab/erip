        name:
          type: string
          nullable: false
          example: Тестовый
        code:
          type: string
          nullable: true
          description: 'Код товара на маркетплейсе'
          example: '100008095'
        sku:
          type: string
          nullable: true
          description: 'Артикул; пустая строка, если продавец его не указал'
