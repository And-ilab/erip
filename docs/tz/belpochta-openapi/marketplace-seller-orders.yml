            - in_progress_paid
            - in_progress_unpaid
            - on_the_road_paid
            - on_the_road_unpaid
            - ready_for_pickup_paid
            - ready_for_pickup_unpaid
            - delivered_paid
            - canceled_by_user_no_refund
            - canceled_by_user_refund_required
            - canceled_by_user_refunded
            - canceled_by_seller_no_refund
            - canceled_by_seller_refund_required
            - canceled_by_seller_refunded
            - canceled_by_admin_no_refund
            - canceled_by_admin_refund_required
            - canceled_by_admin_refunded
            - canceled_unpaid
            - missed_by_seller_no_refund
            - missed_by_seller_refund_required
            - missed_by_seller_refunded
            - unclaimed_no_refund
