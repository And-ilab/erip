openapi: 3.0.0
info:
  title: 'Marketplace Seller Orders API'
  description: "API для управления заказами, отправлениями и партиями продавца на маркетплейсе.\n\n## Авторизация\nВсе запросы требуют заголовок `Authorization: Bearer <token>` с токеном продавца.\nПродавец имеет доступ только к своим заказам и отправлениям — при обращении к чужим\nресурсам возвращается `403`. Рекомендуется также передавать `Accept: application/json`.\n\n## Денежные суммы\nВсе суммы (`amount`) передаются в **копейках** — минорных единицах валюты `BYN`.\nНапример `amount: 80788` означает `807.88 BYN`.\n\n## Коды товара в позиции\nВ каждой позиции заказа (`products[]`, `order_items[]`) приходят два кода\nтовара **на момент оформления заказа**:\n\n* `sdo` — код товара продавца. У Белпочты это «Код СДО» из справочника\n  `GET /api/partner/v1/sdo-codes`, у остальных продавцов — произвольная\n  строка. Технически поле одно и то же, различается только название в\n  интерфейсе.\n* `external_id` — код товара в учетной системе продавца (у Белпочты «Код 1С»),\n  необязательная строка у всех продавцов.\n\nОба берутся из снимка позиции, поэтому не меняются, если продавец потом\nотредактировал коды у товара. Если на момент оформления код не был задан,\nполе приходит пустым (`null`). У заказов, оформленных до появления\n`external_id` в снимке, это поле всегда `null` — задним числом оно\nне восстанавливается.\n\nЗначения для полей товара — в спецификации каталога.\n\n## УНП покупателя\nВ объекте покупателя (`buyer` в заказе, `recipient` в отправлении) приходит\nполе `tin` — УНП. Значение берётся из данных, зафиксированных при оформлении\nзаказа, поэтому не меняется, если покупатель потом отредактировал профиль.\nУ физического лица поле равно `null`.\n\n## Жизненный цикл доставки\n1. **Создать отправление** — `POST /api/partner/v1/mailings` (по получателю и позициям заказа).\n2. **Подтвердить отправление** — `PATCH /api/partner/v1/mailings/{mailing}` с фактическим весом\n   (не меньше расчётного `calculated_weight`).\n3. **Сформировать партию** — `POST /api/partner/v1/batches` создаёт партию в статусе `uncommitted`.\n4. **Зафиксировать партию** — `PATCH /api/partner/v1/batches/{id}/commit`: статус меняется\n   на `committed`, начинается формирование документов отправлений.\n5. **Дождаться документов** — `GET /api/partner/v1/mailings/{id}/document` возвращает поле\n   `status`: `processing` → `done` (или `error`).\n6. **Скачать** бланк/чеки/расписку — методы `*/download` доступны, когда документ в статусе `done`.\n"
  version: 1.0.0
servers:
  -
    url: 'https://postmarket.by'
tags:
  -
    name: Заказ
  -
    name: Продукт
  -
    name: Отправление
  -
    name: 'Продукты в отправлении'
  -
    name: Партия
  -
    name: Документ
  -
    name: Получатели
paths:
  /api/partner/v1/orders:
    get:
      tags:
        - Заказ
      summary: 'Получить все заказы продавца'
      description: "Список заказов продавца, которому принадлежит токен.\n\nВ список попадают те же заказы, что продавец видит в кабинете: оплаченные,\nс оплатой при получении, по счёт-фактуре или в кредит, а также все завершённые.\nЗаказ с неоплаченной онлайн-оплатой (карта, ЕРИП, Оплати, сертификат) в список не попадает.\n\nКаждая позиция заказа в `items` отдаётся отдельной записью.\n"
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: Accept-Language
          in: header
          required: false
          description: 'Язык подписей `product_attribute_label` и `product_attributes_labels` (`ru`, `be`, `en`), по умолчанию `ru`'
          schema:
            type: string
            example: ru
        -
          name: search
          in: query
          description: "Поиск по номеру заказа, адресу доставки и данным получателя\n(название организации, УНП, филиал, телефон, email)\n"
          required: false
          schema:
            type: string
        -
          name: 'status[]'
          in: query
          description: 'Фильтрует по статусам заказа'
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - created
                - in_progress
                - completed
                - cancelled
          style: form
          explode: true
          example: created
        -
          name: 'payment_method[]'
          in: query
          description: 'Фильтрует по способам оплаты'
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - card
                - erip
                - transfer
                - upon_receipt
                - bank_loan
                - gift_card
                - oplati
          style: form
          explode: true
          example: upon_receipt
        -
          name: 'shipping_method[]'
          in: query
          description: 'Фильтрует по способам доставки'
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - pickup_parcel_locker
                - pickup_postal_office
                - pickup_seller
                - courier_belpost
                - courier_seller
          style: form
          explode: true
          example: pickup_seller
        -
          name: date_from
          in: query
          description: 'Заказы, созданные в этот день и позже. Сравнивается только дата, время не учитывается.'
          required: false
          schema:
            type: string
            format: date
            example: '2024-03-01'
        -
          name: date_to
          in: query
          description: 'Заказы, созданные в этот день и раньше. Сравнивается только дата, время не учитывается.'
          required: false
          schema:
            type: string
            format: date
            example: '2024-03-15'
        -
          name: page
          in: query
          description: 'Номер страницы'
          schema:
            type: integer
            minimum: 1
            default: 1
        -
          name: per_page
          in: query
          description: 'Количество заказов на странице. Значение больше 100 не ошибка — отдаётся 100.'
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        -
          name: sort_by
          in: query
          description: 'Поле сортировки. При равных значениях заказы дополнительно сортируются по `id` в том же направлении.'
          required: false
          schema:
            type: string
            enum:
              - status
              - payment_method
              - shipping_method
              - created_at
            default: created_at
        -
          name: sort_direction
          in: query
          description: 'Направление сортировки'
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        -
          name: 'items_processing_status[]'
          in: query
          description: "Фильтрует по обработке позиций: `processed` — в заказе есть позиция, добавленная в отправление,\n`unprocessed` — есть позиция вне отправления. Оба значения сразу — без фильтра.\n"
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - processed
                - unprocessed
          style: form
          explode: true
          example: unprocessed
        -
          name: 'product_attributes[]'
          in: query
          description: "Фильтрует по `product_attribute` позиций. Несколько значений объединяются по ИЛИ:\nзаказ попадает в выборку, если хотя бы одна его позиция подходит под одно из значений.\n"
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - created_unpaid
                - created_paid
                - in_progress_paid
                - in_progress_unpaid
                - on_the_road_paid
                - on_the_road_unpaid
                - ready_for_pickup_paid
                - ready_for_pickup_unpaid
                - delivered_paid
                - canceled_by_user_no_refund
                - canceled_by_user_refund_required
                - canceled_by_user_refunded
                - canceled_by_seller_no_refund
                - canceled_by_seller_refund_required
                - canceled_by_seller_refunded
                - canceled_by_admin_no_refund
                - canceled_by_admin_refund_required
                - canceled_by_admin_refunded
                - canceled_unpaid
                - missed_by_seller_no_refund
                - missed_by_seller_refund_required
                - missed_by_seller_refunded
                - unclaimed_no_refund
                - unclaimed_refund_required
                - unclaimed_refunded
                - user_not_picked_up_no_refund
                - user_not_picked_up_refund_required
                - user_not_picked_up_refunded
                - seller_not_delivered_no_refund
                - seller_not_delivered_refund_required
                - seller_not_delivered_refunded
                - returned_no_payment_required
                - returned_refund_required
                - returned_refunded
                - admin_completed_delivered_paid
                - admin_completed_returned_no_payment_required
                - admin_completed_returned_refund_required
                - admin_completed_returned_refunded
          style: form
          explode: true
          example: canceled_by_seller_refund_required
        -
          name: 'cancellation_initiator[]'
          in: query
          description: 'Отменённые заказы по инициатору отмены. Как и остальные фильтры по отмене, оставляет в выборке только отменённые заказы.'
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - user
                - seller
                - admin
          style: form
          explode: true
          example: seller
        -
          name: 'cancellation_reason_id[]'
          in: query
          description: 'Отменённые заказы по ID причины отмены'
          required: false
          schema:
            type: array
            items:
              type: integer
          style: form
          explode: true
        -
          name: cancellation_type
          in: query
          description: 'Отменённые заказы по типу отмены'
          required: false
          schema:
            type: string
            enum:
              - manual
              - automatic
        -
          name: cancelled_at_from
          in: query
          description: 'Заказы, отменённые в этот день и позже. Сравнивается только дата, время не учитывается.'
          required: false
          schema:
            type: string
            format: date
            example: '2024-03-01'
        -
          name: cancelled_at_to
          in: query
          description: 'Заказы, отменённые в этот день и раньше. Сравнивается только дата, время не учитывается.'
          required: false
          schema:
            type: string
            format: date
            example: '2024-03-15'
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderListEntry'
                  links:
                    $ref: '#/components/schemas/Link'
                  meta:
                    $ref: '#/components/schemas/Meta'
        401:
          description: 'Не авторизован'
        403:
          description: 'Продавец на тарифе «Витрина»'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 'Seller has show case subscription plan'
        422:
          description: 'Невалидные параметры запроса'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  '/api/partner/v1/orders/{orderId}':
    get:
      tags:
        - Заказ
      summary: 'Получить заказ на продавца'
      description: 'получает заказ по его айди у продавца'
      parameters:
        -
          name: orderId
          in: path
          description: 'айди заказа'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'найден контакт'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrder'
        401:
          description: 'Не авторизован'
        403:
          description: 'Доступ запрещен'
        404:
          description: 'Заказ не найден'
    patch:
      tags:
        - Заказ
      summary: 'Обновление заказа'
      description: 'запрос обновляет поля в заказе'
      parameters:
        -
          name: orderId
          in: path
          description: 'айди заказа'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrder'
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FullOrder'
  '/api/partner/v1/orders/{orderId}/order-items/{orderItemId}':
    patch:
      tags:
        - Продукт
      summary: 'Обновление продукта'
      description: 'запрос обновляет поля в продукте заказа'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderItem'
      parameters:
        -
          name: orderId
          in: path
          description: 'айди заказа'
          required: true
          schema:
            type: string
        -
          name: orderItemId
          in: path
          description: 'айди продукта'
          required: true
          schema:
            type: string
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProduct'
  '/api/partner/v1/orders/{id}/order-items':
    put:
      tags:
        - Продукт
      summary: 'Обновление всех продуктов'
      description: 'запрос обновляет поля у всех продуктов заказа'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: id
          in: query
          required: true
          schema:
            type: integer
            example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                properties:
                  id:
                    type: integer
                  status:
                    type: string
                    enum:
                      - pending
                      - issued
                      - canceled
                  quantity:
                    type: integer
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderProduct'
  /api/partner/v1/mailings:
    post:
      tags:
        - Отправление
      summary: 'Создать отправление'
      description: 'Создать отправление на белпочте'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreMailing'
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowListMailing'
    get:
      tags:
        - Отправление
      summary: 'Список отправлений'
      description: 'Получить список отправлений'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: sort_direction
          in: query
          required: false
          schema:
            type: string
            enum:
              - desc
              - asc
        -
          name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - created_at
              - weight
        -
          name: f_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - in_progress
              - ready_for_pickup
              - delivered
              - returned
        -
          name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingListData'
  '/api/partner/v1/mailings/{mailing}':
    get:
      tags:
        - Отправление
      summary: Отправление
      description: 'Получить отправление'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: mailing
          in: path
          required: true
          schema:
            type: string
            example: 1
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowMailing'
    delete:
      tags:
        - Отправление
      summary: Отправление
      description: 'разобрать отправление'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: mailing
          in: path
          required: true
          schema:
            type: string
            example: 1
      responses:
        204:
          description: 'удаление успешно'
    patch:
      tags:
        - Отправление
      summary: Отправление
      description: 'Подтвердить отправление'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: mailing
          in: path
          required: true
          schema:
            type: string
            example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMailing'
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowMailing'
  '/api/partner/v1/mailings/{mailing}/items':
    post:
      tags:
        - 'Продукты в отправлении'
      summary: 'Добавить Продукты'
      description: 'Добавить продукт в отправление'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: mailing
          in: path
          required: true
          schema:
            type: string
            example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderProduct'
    delete:
      tags:
        - 'Продукты в отправлении'
      summary: 'Удалить Продукты'
      description: 'Удалить продукты в отправление'
      parameters:
        -
          name: Accept
          in: header
          required: true
          example: application/json
          schema:
            type: string
            example: application/json
        -
          name: mailing
          in: path
          required: true
          schema:
            type: string
            example: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: integer
      responses:
        204:
          description: 'Успешный ответ'
  /api/partner/v1/batches:
    get:
      tags:
        - Партия
      summary: 'Получить все партии продавца'
      description: 'Получить список партии для аутентифицированного продавца'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: page
          in: query
          description: 'Номер страницы'
          required: false
          schema:
            type: integer
        -
          name: per_page
          in: query
          description: 'Номер страницы'
          required: false
          schema:
            type: integer
        -
          name: f_status
          in: query
          description: 'фильтрация по статусу'
          schema:
            type: string
            enum:
              - uncommitted
              - committed
        -
          name: f_created_at
          in: query
          description: 'фильтрация по дате'
          schema:
            type: string
            format: datetime
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchList'
                  links:
                    $ref: '#/components/schemas/Link'
                  meta:
                    $ref: '#/components/schemas/Meta'
    post:
      tags:
        - Партия
      summary: 'Создать партию из отправлений'
      description: 'Создать партию из отправлений'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mailings:
                  type: array
                  items:
                    type: integer
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
  '/api/partner/v1/batches/{id}':
    get:
      tags:
        - Партия
      summary: 'Получить партию'
      description: 'Получить партию по id для аутентифицированного продавца'
      parameters:
        -
          name: Accept
          in: header
          required: true
          schema:
            type: string
            example: application/json
        -
          name: id
          in: query
          required: true
          schema:
            type: integer
            example: 1
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
  '/api/partner/v1/mailings/{id}/document':
    get:
      tags:
        - Документ
      summary: 'Получить документ отправления'
