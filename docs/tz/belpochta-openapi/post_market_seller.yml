          nullable: true
          example: 25
        height:
          type: integer
          nullable: true
          example: 20
        weight:
          type: integer
          nullable: true
          example: 3000
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ParameterForProductRequest'
      required:
