  /api/v1/business/batch-mailing/receipt:
    get:
      tags:
        - Расписки
      summary: 'Получение списка расписок'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptIndex'
    post:
      tags:
        - Расписки
      summary: 'Создание расписки'
      description: "Пример запроса:\n\n```bash\ncurl --location 'http://localhost:8001/api/v1/business/batch-mailing/receipt' \\\n  --header 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --header 'Authorization: Bearer <access_token>' \\\n  --data '{\"lists\":[4]}'\n```\n\nПоле `message` в ответе 422 — краткое резюме: первое сообщение об ошибке; если ошибок несколько, к нему добавляется указание на число остальных. Полный перечень — в `errors`.\n"
      security:
        -
          bearerAuth: {  }
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: Content-Type
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptRequestBody'
            example:
              lists:
                - 4
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        422:
          description: "Ошибка валидации входных данных. Ниже — фактические ответы Laravel для правил `CreateReceiptRequest` (локаль `ru`, как в работающем API).\nЕсли id партии чужой или записи нет, срабатывает правило `exists` с условием `user_id` текущего пользователя — текст тот же, что и для «несуществующего» id.\n"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                ru_lists_required:
                  summary: '[ru] Нет поля lists (пустой JSON-объект {})'
                  value:
                    message: 'Поле lists обязательно для заполнения.'
                    errors:
                      lists:
                        - 'Поле lists обязательно для заполнения.'
                ru_lists_not_array:
                  summary: '[ru] lists не массив'
                  value:
                    message: 'Поле lists должно быть массивом.'
                    errors:
                      lists:
                        - 'Поле lists должно быть массивом.'
                ru_lists_max_and_exists:
                  summary: '[ru] Больше 8 id — ошибка max и exists по каждому индексу'
                  description: 'При 9+ элементах одновременно проверяются `max:8` и `exists` для каждого элемента.'
                  value:
                    message: 'Количество элементов в поле lists не может превышать 8. (and 9 more errors)'
                    errors:
                      lists:
                        - 'Количество элементов в поле lists не может превышать 8.'
                      lists.0:
                        - 'Выбранное значение для lists.0 некорректно.'
                      lists.1:
                        - 'Выбранное значение для lists.1 некорректно.'
                      lists.2:
                        - 'Выбранное значение для lists.2 некорректно.'
                      lists.3:
                        - 'Выбранное значение для lists.3 некорректно.'
                      lists.4:
                        - 'Выбранное значение для lists.4 некорректно.'
                      lists.5:
                        - 'Выбранное значение для lists.5 некорректно.'
                      lists.6:
                        - 'Выбранное значение для lists.6 некорректно.'
                      lists.7:
                        - 'Выбранное значение для lists.7 некорректно.'
                      lists.8:
                        - 'Выбранное значение для lists.8 некорректно.'
                ru_foreign_or_missing_list_id:
                  summary: '[ru] id не существует или не принадлежит пользователю (один id в массиве)'
                  value:
                    message: 'Выбранное значение для lists.0 некорректно.'
                    errors:
                      lists.0:
                        - 'Выбранное значение для lists.0 некорректно.'
                ru_lists_item_required:
                  summary: '[ru] Пустой элемент массива (например `[1, ""]`)'
                  value:
                    message: 'Выбранное значение для lists.0 некорректно. (and 1 more error)'
                    errors:
                      lists.0:
                        - 'Выбранное значение для lists.0 некорректно.'
                      lists.1:
                        - 'Поле lists.1 обязательно для заполнения.'
