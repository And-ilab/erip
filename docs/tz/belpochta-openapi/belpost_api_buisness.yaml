components:
  schemas:
    Recipient:
      required:
        - address
        - type
      type: object
      properties:
        foreign_id:
          type: string
          description: 'Внешний идентификатор'
          nullable: true
          example: '12'
        type:
          type: string
          description: 'Тип получателя'
          example: legal
          enum:
            - legal
            - individual
            - individual_to_organization
            - individual_entrepreneur
        first_name:
          maxLength: 20
          type: string
          description: 'имя получателя'
          nullable: true
          example: Имя
        second_name:
          maxLength: 20
          type: string
          description: 'Отчество получателя'
          example: Отчество
        last_name:
          maxLength: 25
          type: string
          description: 'Фамилия получателя'
          example: Фамилия
        company_name:
          maxLength: 30
          type: string
          description: 'Компания получателя'
          example: 'ООО Пример'
        phone:
          maxLength: 12
          type: string
          description: 'Номер телефона получателя'
          example: '375259321235'
        email:
          maxLength: 30
          type: string
          description: 'Имейл получателя'
          example: test@test.com
        address:
          $ref: '#/components/schemas/Recipient_address'
      example:
        type: legal
        first_name: Имя
        second_name: Отчество
        last_name: Фамилия
        company_name: 'ООО Пример'
        phone: '375259321235'
        email: test@test.com
        address:
          postcode: '220141'
          country_code: BY
          region: Минская
          district: Минский
          city: Минск
          street: Никифорова
          building: '35'
          housing: ''
          apartment: '12'
          address_type: on_demand
          street_type: улица
          city_type: город
    Recipient_index:
      properties:
        total:
          type: integer
          description: 'Количесво получателей'
          example: 1
        current_page:
          type: integer
          description: 'Текущая страница'
          example: 1
        per_page:
          type: integer
          description: 'Максимальное значение получателей на странице'
          example: 100
        from:
          type: integer
          description: 'Следующая страница'
          example: 1
        first_page_url:
          type: string
          description: 'Ссылку на первую страницу'
          example: 'https://belpost.by/api/v1/business/batch-mailing/recipient?page=1'
        last_page:
          type: integer
          description: 'Номер последней страницы'
          example: 1
        last_page_url:
          type: string
          description: 'Ссылка на полследнюю страницу'
          example: 'https://belpost.by/api/v1/business/batch-mailing/recipient?page=1'
        next_page_url:
          type: string
          description: 'Ссылка следующей страница'
          nullable: true
        path:
          type: string
          description: 'Путь до получателей'
          example: 'https://belpost.by/api/v1/business/batch-mailing/recipient'
        prev_page_url:
          type: string
          description: 'Ссылка на предыдущюю страницу'
          nullable: true
        to:
          type: integer
          description: 'Количество получателей на странице'
          example: 1
        data:
          type: array
          items:
            $ref: '#/components/schemas/Recipient_index_data'
      description: 'Список получателей'
    Recipient_address:
      required:
        - building
        - city
        - country_code
        - postcode
        - street
        - street_type
        - address_type
        - city_type
      type: object
      properties:
        postcode:
          maxLength: 6
          minLength: 6
          type: string
          description: Индекс
          example: '220141'
        country_code:
          type: string
          description: 'Код страны'
          example: BY
        region:
          maxLength: 22
          type: string
          description: Регион
          example: Минская
          nullable: true
        district:
          maxLength: 18
          type: string
          description: Район
          example: Минский
          nullable: true
        city:
          maxLength: 25
          type: string
          description: Город
          example: Минск
        street:
          maxLength: 50
          type: string
          description: Улица
          example: Никифорова
        building:
          maxLength: 8
          type: string
          description: Дом
          nullable: false
          example: '35'
        housing:
          maxLength: 2
          type: string
          description: Корпус
          nullable: true
          example: ''
        apartment:
          maxLength: 5
          type: string
          description: Квартира
          nullable: true
          example: '12'
        address_type:
          type: string
          description: 'Тип адреса'
          example: on_demand
          enum:
            - address
            - on_demand
            - subscriber_box
        street_type:
          maxLength: 10
          type: string
          example: улица
        city_type:
          maxLength: 30
          type: string
          example: город
    Recipient_index_data:
      required:
        - address
        - id
        - type
      type: object
      properties:
        id:
          type: integer
          description: 'Идентификатор получателя'
          example: 1
        foreign_id:
          type: string
          description: 'Внешний идентификатор'
          nullable: true
          example: '12'
        type:
          type: string
          description: 'Тип получателя'
          example: legal
          enum:
            - legal
            - individual
            - individual_to_organization
            - individual_entrepreneur
        first_name:
          maxLength: 20
          type: string
          description: 'имя получателя'
          nullable: true
          example: ''
        second_name:
          maxLength: 20
          type: string
          description: 'Отчество получателя'
          example: ''
        last_name:
          maxLength: 25
          type: string
          description: 'Фамилия получателя'
          example: ''
        company_name:
          maxLength: 30
          type: string
          description: 'Компания получателя'
          example: 'ООО Пример'
        phone:
          maxLength: 12
          type: string
          description: 'Номер телефона получателя'
          example: '375259321235'
        email:
          maxLength: 30
          type: string
          description: 'Имейл получателя'
          example: test@test.com
        address:
          $ref: '#/components/schemas/Recipient_address'
    Batching_mailing:
      type: object
      properties:
        id:
          type: integer
          description: 'ID партии'
          format: int64
          example: 12
        name:
          type: string
          description: 'Название партии'
          example: string
        filial:
          type: string
          nullable: true
          description: 'Филиал отправителя'
          example: null
        trn:
          type: string
          description: УНП
          example: 192766206
        address:
          type: string
          description: Адрес
          example: '220076, ГОРОД МИНСК, УЛИЦА ГЛЕБОВА ЕВГЕНИЯ ДОМ 11'
        iban:
