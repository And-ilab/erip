  responses:
    ListTypeIncompatible:
      description: "Вид отправления несовместим с итоговым состоянием партии (или переданное значение признака\nнедопустимо для текущего вида). Ошибка приходит на конкретное поле и, дополнительно,\nна `postal_delivery_type` — сводкой со списком несовместимых полей.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            postal_items_in_ops_conflict:
              summary: 'Смена вида на ecommerce_optima при сохранённом postal_items_in_ops = false'
              value:
                message: 'Признак приема отправлений в ОПС неверного типа (and 1 more error)'
                errors:
                  postal_items_in_ops:
                    - 'Признак приема отправлений в ОПС неверного типа'
                  postal_delivery_type:
                    - 'Нельзя изменить вид отправления на «ecommerce_optima»: для него недопустимы текущие значения полей: postal_items_in_ops. Передайте корректные значения этих полей в этом же запросе или создайте новую партию.'
            declared_value_conflict:
              summary: 'Смена вида на package при сохранённой объявленной ценности'
              value:
                message: 'Объявленная ценность не может быть true (and 1 more error)'
                errors:
                  is_declared_value:
                    - 'Объявленная ценность не может быть true'
                  postal_delivery_type:
                    - 'Нельзя изменить вид отправления на «package»: для него недопустимы текущие значения полей: is_declared_value. Передайте корректные значения этих полей в этом же запросе или создайте новую партию.'
            postal_items_in_ops_for_current_type:
              summary: 'Признак «приём не в ОПС» для вида, который его не допускает (без смены вида)'
              value:
                message: 'Признак приема отправлений в ОПС неверного типа (and 1 more error)'
                errors:
                  postal_items_in_ops:
                    - 'Признак приема отправлений в ОПС неверного типа'
                  postal_delivery_type:
                    - 'Значения полей postal_items_in_ops недопустимы для вида отправления «package».'
    GenerationInProgress:
      description: "По партии уже идёт генерация документов (бланков/ярлыков). Повторный запуск генерации\nотклонён, чтобы не сбить текущий прогон — дождитесь его завершения и повторите попытку.\nПо истечении тайм-аута зависший прогон освобождается автоматически, и генерация снова доступна.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            message: 'Генерация документов по этой партии ещё выполняется. Дождитесь её завершения и повторите попытку.'
            errors:
              error:
                - 'Генерация документов по этой партии ещё выполняется. Дождитесь её завершения и повторите попытку.'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
