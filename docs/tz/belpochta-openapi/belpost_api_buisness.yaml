openapi: 3.0.0
info:
  title: 'API партионных отправлений'
  version: 1.1.0
servers:
  -
    url: 'https://api.belpost.by'
security:
  -
    bearerAuth: {  }
tags:
  -
    name: Получатели
  -
    name: Партии
  -
    name: Расписки
  -
    name: 'Отправления внутри партии'
  -
    name: 'Вложение в отправлении'
paths:
  /api/v1/business/batch-mailing/recipient:
    get:
      tags:
        - Получатели
      summary: 'Найти всех получателей'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: type
          in: query
          required: false
          schema:
            type: string
            enum:
              - legal
              - individual
              - individual_entrepreneur
            description: 'тип получателя'
            example: individual_entrepreneur
            nullable: true
        -
          name: perPage
          in: query
          required: false
          schema:
            type: integer
            description: 'количество на странице'
            example: 16
            minimum: 5
            maximum: 100
            nullable: true
        -
          name: search
          in: query
          required: false
          schema:
            type: string
            description: 'поисковая строка'
            example: Иванов
            maxLength: 256
            nullable: true
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient_index'
    post:
      tags:
        - Получатели
      summary: 'Создать получателя'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: Content-Type
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/batch_mailing_recipient_body'
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/inline_response_200'
  '/api/v1/business/batch-mailing/recipient/{id}':
    get:
      tags:
        - Получатели
      summary: 'Найти получателя по его ID'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient_index_data'
    post:
      tags:
        - Получатели
      summary: 'Изменить получателя'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: Content-Type
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recipient_id_body'
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient_index_data'
  /api/v1/business/batch-mailing/list:
    get:
      tags:
        - Партии
      summary: 'Найти все партии'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: status
          in: query
          schema:
            type: string
            nullable: true
            enum:
              - uncommitted
              - committed
              - in_ops
            description: 'Статус отправления'
        -
          name: perPage
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 50
            nullable: true
            description: 'количество элементов на странице'
        -
          name: page
          in: query
          schema:
            type: integer
            minimum: 1
            nullable: true
            description: 'номер страницы'
        -
          name: search
          in: query
          schema:
            type: string
            nullable: true
            maxLength: 256
            description: пойск
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing_items_index'
    post:
      tags:
        - Партии
      summary: 'Создать партию'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: Content-Type
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_batch_mailing'
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
  '/api/v1/business/batch-mailing/list/{id}':
    get:
      tags:
        - Партии
      summary: 'Найти партию по ее ID'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
    post:
      tags:
        - Партии
      summary: 'Обновление партии'
      description: "Обновляет несформированную партию (статус `uncommitted`).\n\n## Смена вида отправления (`postal_delivery_type`)\n\nВид отправления **нельзя сменить, если после изменения часть признаков партии станет\nнедопустимой для нового вида**. Проверяется итоговое состояние партии: значения из запроса,\nналоженные на уже сохранённые. Непереданные поля берутся из партии — то есть отказ возможен\nи тогда, когда «проблемное» поле в запрос не попало.\n\nУчаствуют в проверке (те же правила, что и при создании партии):\n\n| Поле | Ограничение по виду отправления |\n|---|---|\n| `postal_items_in_ops` | `false` (приём отправлений не в ОПС) допустим только для `ecommerce_standard`, `ecommerce_elite`, `ecommerce_express`, `marketplace` |\n| `is_declared_value` | `true` недопустим для `ordered_postcard`, `ordered_letter`, `ordered_parcel_post`, `ordered_small_package`, `package`, а также при `negotiated_rate = true`; для `small_package_declare_value` и `package_declare_value` при `negotiated_rate = false` обязателен `true` |\n\nПример отказа: партия создана как `ecommerce_standard` с `postal_items_in_ops: false`;\nпопытка сменить вид на `ecommerce_optima` (где приём не в ОПС не предусмотрен) возвращает\n`422`, вид отправления не меняется.\n\nЧтобы всё-таки сменить вид, передайте корректные для нового вида значения этих полей\n**в том же запросе** (например `postal_delivery_type: ecommerce_optima` вместе с\n`postal_items_in_ops: true`) — либо создайте новую партию.\n\nОшибки приходят и на конкретное поле, и на `postal_delivery_type` (сводка со списком\nнесовместимых полей). Проверка не выполняется, если запрос не содержит ни\n`postal_delivery_type`, ни зависящих от вида признаков (например при правке одного лишь\n`name`) — чтобы давно созданные партии оставались редактируемыми.\n"
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: Content-Type
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
          example: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Create_batch_mailing'
            examples:
              rename:
                summary: 'Переименование партии'
                value:
                  name: 'Партия для тестов'
              type_change_with_fixed_fields:
                summary: 'Смена вида отправления вместе с приведением признаков к допустимым'
                value:
                  postal_delivery_type: ecommerce_optima
                  postal_items_in_ops: true
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
        422:
          $ref: '#/components/responses/ListTypeIncompatible'
    delete:
      tags:
        - Партии
      summary: 'Удалить партию'
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json: {  }
  '/api/v1/business/batch-mailing/list/{id}/commit':
    post:
      tags:
        - Партии
      summary: 'Сформировать партию'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
  '/api/v1/business/batch-mailing/list/{id}/duplicate-full':
    post:
      tags:
        - Партии
      summary: 'Создание дубликата партии с ее оправлениями'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing_list'
  '/api/v1/business/batch-mailing/list/{id}/duplicate':
    post:
      tags:
        - Партии
      summary: 'Создание дубликата партии без ее оправлений'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing_list'
  '/api/v1/business/batch-mailing/list/{id}/document':
    get:
      tags:
        - Партии
      summary: 'Документы партии'
      description: "Запускает генерацию документа (расписки/бланков) по сформированной партии. Если по партии\nгенерация ещё идёт, запрос отклоняется с ошибкой `422` (см. ответ 422) — повторный запуск\nне стартует, чтобы не сбить текущий прогон. Дождитесь завершения и повторите попытку.\n"
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_document'
        422:
          $ref: '#/components/responses/GenerationInProgress'
  /api/v1/business/batch-mailing/documents:
    get:
      tags:
        - Партии
      summary: 'Список документов партий'
      description: "Документы партий текущего юридического лица.\n\nСтраница задаётся `page` (с 1) и `perPage` (от 5 до 50, по умолчанию 5).\nЕсли `current_page` меньше `last_page`, следующая страница — в `next_page_url`.\n\nФильтры можно сочетать:\n\n`/api/v1/business/batch-mailing/documents?list_id=1113586&status=done&parent_only=1&page=1&perPage=20`\n"
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: list_id
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1113586
          description: 'Только документы указанной партии.'
        -
          name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - new
              - processing
              - done
              - error
            example: done
          description: "`new` — создан, `processing` — генерируется,\n`done` — готов к скачиванию, `error` — ошибка генерации.\n"
        -
          name: parent_only
          in: query
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
            default: 0
            example: 1
          description: '1 — только архив партии. 0 — архив партии и документы отправлений.'
        -
          name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
            example: '12'
          description: 'Порядковый номер партии за год, название партии или дата создания документа (`YYYY-MM-DD`).'
        -
          name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
            example: 1
          description: 'Номер страницы.'
        -
          name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 5
            maximum: 50
            default: 5
            example: 20
          description: 'Количество документов на странице.'
      responses:
        200:
          description: 'Страница списка документов'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_documents'
              example:
                total: 3
                current_page: 1
                per_page: 20
                from: 0
                first_page_url: 'https://api.belpost.by/api/v1/business/batch-mailing/documents?page=1'
                last_page: 1
                last_page_url: 'https://api.belpost.by/api/v1/business/batch-mailing/documents?page=1'
                next_page_url: null
                path: 'https://api.belpost.by/api/v1/business/batch-mailing/documents'
                prev_page_url: null
                to: 20
                data:
                  -
                    id: 3984
                    list_id: 1113586
                    status: done
                    path: 'https://s3.example/storage/documents/1/2026/1113586.zip'
                    expire_at: '2026-10-10 12:00:00'
                    created_at: '2026-09-10 12:00:00'
                    updated_at: '2026-09-10 12:05:00'
                    name: 'Партия (заказ) №12'
        401:
          description: 'Не передан или недействителен токен'
        403:
          description: 'Нет доступа к API партионных отправлений или не заполнены реквизиты юридического лица'
        422:
          description: 'Некорректные параметры запроса'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  '/api/v1/business/batch-mailing/documents/{id}/download':
    get:
      tags:
        - Партии
      summary: 'Скачать архив документов'
      description: 'Возвращает ZIP-архив с документами (например, бланки, сопроводительные документы) по ID.'
      parameters:
        -
          name: id
          in: path
          required: true
          description: 'ID документа'
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Успешный ответ. Возвращается ZIP-архив с документами.'
          headers:
            Content-Disposition:
              description: 'Указывает, что контент должен быть скачан как вложение, содержит имя файла.'
              schema:
                type: string
              example: 'attachment; filename="document.zip"'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        404:
          description: 'Документ не найден или архив еще не сгенерирован'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'Resource not found.'
        422:
          description: 'Файл не найден на сервере (например, не успел сгенерироваться)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: 'File not found.'
  '/api/v1/business/batch-mailing/list/{id}/generate-blank':
    post:
      tags:
        - Партии
      summary: 'Создать бланки партии'
      description: "Запускает генерацию бланков/ярлыков по партии. Если по этой партии генерация ещё идёт,\nзапрос отклоняется с ошибкой `422` (см. ответ 422) — повторный запуск не стартует, чтобы\nне сбить текущий прогон. Дождитесь завершения генерации и повторите попытку.\n"
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
        404:
          description: 'Not found document'
        422:
          $ref: '#/components/responses/GenerationInProgress'
  '/api/v1/business/batch-mailing/item/{s10code}':
    get:
      tags:
        - Партии
      summary: 'Найти партию по с10 коду отправления'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: s10code
          in: path
          required: true
          schema:
            type: string
          example: PC111200306BY
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batching_mailing'
        404:
          description: 'не найдена партия'
  '/api/v1/business/batch-mailing/receipt/{id}':
    get:
      tags:
        - Расписки
      summary: 'Найти расписку по ее ID'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
    post:
      tags:
        - Расписки
      summary: 'Обновление расписки'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          schema:
            type: string
          example: 12
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                lists:
                  - id
                  - id2
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
  '/api/v1/business/batch-mailing/receipt/{id}/download':
    get:
      tags:
        - Расписки
      summary: 'Скачать расписку'
      description: 'Возвращает файл расписки в формате PDF или XLSX.'
      parameters:
        -
          name: Accept
          in: header
          required: false
          style: simple
          explode: false
          schema:
            type: string
            enum:
              - application/json
            default: application/json
        -
          name: id
          in: path
          required: true
          description: 'ID расписки'
          schema:
            type: string
          example: 12
        -
          name: type
          in: query
          required: false
          description: 'Формат скачиваемого файла (по умолчанию pdf)'
          schema:
            type: string
            enum:
              - pdf
              - xlsx
            default: pdf
          example: pdf
      responses:
        200:
          description: 'Успешный ответ. Возвращается файл расписки.'
          headers:
            Content-Disposition:
              description: 'Указывает, что контент должен быть скачан как вложение, содержит имя файла.'
              schema:
                type: string
              example: 'attachment; filename="receipt.pdf"'
          content:
            application/pdf:
              schema:
