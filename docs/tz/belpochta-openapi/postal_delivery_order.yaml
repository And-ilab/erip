          type: string
          description: 'Название страны'
    postal_delivery_store_request:
      type: object
      description: "Схема запроса для создания почтового отправления.\n\n## Обязательные поля\n\n- `parcel` - информация о посылке (тип, размеры, места отправки/доставки)\n- `addons` - дополнительные услуги и настройки\n- `recipient_contact_widget_data` - данные получателя через адресный виджет\n- `sender_contact_widget_data` - данные отправителя через адресный виджет\n\n## Опциональные поля\n\n- `cp72` - декларация отправления (для международных отправлений)\n- `sender_payment_info` - дополнительные данные для реквизитов отправителя\n\n## Важные особенности\n\n### Автоматическая валидация\nСистема автоматически валидирует данные согласно правилам для указанной страны получателя.\n\n### Адресный виджет\nПоля `*_contact_widget_data` содержат структурированные данные от адресного виджета,\nкоторые автоматически валидируются согласно правилам для конкретной страны.\n\n### Получение адресов из справочника\nДля адресов Беларуси (BY) обязательно получение идентификатора `id` через адресный справочник:\n- `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=...`\n- `GET /api/v2/business/geo-directory/dictionary/{id}`\n"
      required:
        - parcel
        - addons
        - recipient_contact_widget_data
        - sender_contact_widget_data
      properties:
        parcel:
          required:
            - measures
            - departure
            - arrival
          type: object
          nullable: false
          properties:
            s10code:
              type: string
              nullable: true
              description: 'с10 код отправления'
              example: null
            type:
              type: string
              nullable: false
              description: 'вид отправления'
              example: ems
              enum:
                - package
                - ems
                - small_package
                - small_valued_package
            attachment_type:
              type: string
              example: products
              enum:
                - products
              nullable: false
              description: 'вид вложения'
            measures:
              type: object
              nullable: false
              description: 'параметры, единицы измерения отправления'
              properties:
                weight:
                  example: 0
                  type: integer
                  nullable: true
                  description: вес
            departure:
              type: object
              nullable: false
              description: 'параметры отправки'
              required:
                - country
                - place
              properties:
                country:
                  example: BY
                  type: string
                  enum:
                    - BY
                  description: страна
                  nullable: false
                place:
                  example: post_office
                  type: string
                  enum:
                    - post_office
                  description: 'место отправки'
                  nullable: false
                place_uuid:
                  example: null
                  type: string
                  nullable: true
                  description: 'идентифика́тор места отправки'
            arrival:
              type: object
              description: 'параметры места доставки'
              nullable: false
              required:
                - country
                - place
              properties:
                country:
                  example: BY
                  type: string
                  description: страна
                  nullable: false
                place:
                  example: post_office
                  type: string
                  enum:
                    - post_office
                  description: 'место доставки'
                  nullable: false
                place_uuid:
                  type: string
                  nullable: true
                  description: 'идентифика́тор места доставки'
        addons:
          type: object
          nullable: false
          required:
            - priority_parcel
            - attachment_inventory
            - paid_shipping
            - careful_fragile
            - bulky
            - ponderous
            - payment_upon_receipt
            - hand_over_personally
            - return_of_documents
            - open_upon_delivery
            - delivery_to_work
          properties:
            declared_value:
              type: object
              nullable: true
              description: ОЦ
              properties:
                currency:
                  type: string
                  description: 'валюта ОЦ'
                  enum:
                    - BYN
                value:
                  type: number
                  description: 'Значение ОЦ'
            cash_on_delivery:
              type: object
              nullable: true
              description: НП
              properties:
                currency:
                  type: string
                  description: 'валюта НП'
                  enum:
                    - BYN
                value:
                  type: number
                  description: 'Значение НП'
            IOSS:
              type: string
              nullable: true
              description: 'Идентификационный номер IOSS'
            registered_notification:
              type: string
              nullable: true
              description: 'Уведомление о доставке заказное'
            simple_notification:
              example: false
              type: boolean
              nullable: false
              description: 'Уведомление о доставке простое'
            sms_notification:
              type: boolean
              nullable: false
              description: 'Уведомление о доставке по viber или sms'
            email_notification:
              example: false
              type: boolean
              nullable: false
              description: 'Уведомление о доставке по email'
            priority_parcel:
              description: 'Приоритетное отправление'
              type: boolean
              nullable: false
            attachment_inventory:
              description: 'Опись вложения'
              type: boolean
              nullable: false
            paid_shipping:
              description: 'Оплаченная доставка'
              type: boolean
              nullable: false
            careful_fragile:
              description: 'Осторожно! хрупкое'
              type: boolean
              nullable: false
            bulky:
              description: Крупногабаритное
              type: boolean
              nullable: false
            ponderous:
              description: Тяжеловесное
              type: boolean
              nullable: false
            payment_upon_receipt:
              description: 'Оплата при получении'
              type: boolean
              nullable: false
            hand_over_personally:
              description: 'Вручить лично'
              type: boolean
              nullable: false
            return_of_documents:
              description: 'Возврат документов'
              type: boolean
              nullable: false
            open_upon_delivery:
              description: 'Вскрыть при вручении'
              type: boolean
              nullable: false
            delivery_to_work:
              description: 'Доставка по месту работы'
              type: boolean
              nullable: false
            time_of_delivery:
              description: 'Время доставки'
              type: object
              nullable: true
              properties:
                type:
                  type: string
                  enum:
                    - level1
                    - level2
                    - level3
                    - level4
                  description: 'тип временного интервала'
                time_interval:
                  description: 'временной интервал'
                  type: object
                  properties:
                    to:
                      description: до
                      type: string
                      default: '10:10'
                    from:
                      description: от
                      type: string
                      default: '08:10'
        cp72:
          type: array
          example: {  }
          description: 'декларация отправления'
          required:
            - licences
            - certificates
          items:
            type: object
            properties:
              name:
                type: object
                description: 'название вложение в декларации'
                required:
                  - name
                  - unit
                  - price
                  - count
                  - weight
                properties:
                  name:
                    required:
