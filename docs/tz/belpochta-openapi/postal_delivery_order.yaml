openapi: 3.0.0
info:
  title: 'API предпочтовой подготовки'
  description: "# API предпочтовой подготовки для бизнес-клиентов\n\nДанный раздел описывает работу с API предпочтовой подготовки для бизнес-клиентов,\nкоторые приобрели доступ к API Белпочты.\n\n## Основные возможности\n\n### Создание почтовых отправлений\n- Поддержка различных типов отправлений (посылки, EMS, мелкие пакеты)\n- Автоматическая валидация адресов отправителя и получателя\n- Интеграция с адресным виджетом для корректного заполнения контактных данных\n\n### Автоматическая валидация\nСистема автоматически:\n1. **Валидирует данные** отправителя и получателя согласно правилам для конкретной страны\n2. **Обрабатывает ошибки** с понятными сообщениями на русском языке\n\n## Важные особенности\n\n### Отправитель всегда из Беларуси\n- **Отправитель** всегда валидируется как республиканский адрес (BY)\n- **Правила валидации** для отправителя всегда применяются для Беларуси\n\n### Получатель зависит от страны доставки\n- **Страна получателя** определяется из поля `country_code` в данных получателя\n- **BY** - республиканские правила (обязательные: country_code, id, type, house)\n- **Другие страны** - международные правила (обязательные: country_code, postcode, city, address_line)\n\n## Интеграция с адресным виджетом\n\n### Получение адресов из справочника\nДля получения адресов и их идентификаторов используйте endpoints адресного справочника:\n- `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=Минск` - поиск адресов\n- `GET /api/v2/business/geo-directory/dictionary/{id}` - получение конкретного адреса по ID\n- `POST /api/v2/business/geo-directory/dictionary-list` - поиск адресов через POST запрос\n\nПолученный `id` из справочника используется в поле `address.id` при создании отправления.\n\n### Использование в адресном виджете\nАдресный виджет использует данные из справочника для:\n- Определения обязательных полей для конкретной страны\n- Валидации введенных данных\n- Отображения подсказок пользователю\n\n### Поддержка международных отправлений\n- Автоматическое определение правил для разных стран\n- Поддержка различных форматов адресов\n- Интеграция с таможенными требованиями\n"
  version: 2.0.0
servers:
  -
    url: 'https://api.belpost.by/api/v1/business'
security:
  -
    bearerAuth: {  }
paths:
  '/postal-deliveries/validation/{countryCode}':
    get:
      summary: 'Получение правил валидации для страны (Бизнес API)'
      description: "Позволяет получить объект с правилами валидации для конкретной страны.\n\n## Назначение\n\nЭтот эндпоинт используется для получения правил валидации, которые применяются\nпри создании почтовых отправлений в указанную страну.\n\n## Использование\n\n### В бизнес-приложениях\n- Получение ограничений по весу, размерам, объявленной ценности\n- Проверка поддержки дополнительных услуг (уведомления, наложенный платеж)\n- Определение доступных типов отправлений для конкретной страны\n\n### В адресном виджете\n- Определение обязательных полей для адреса получателя\n- Валидация введенных данных согласно правилам страны\n- Отображение подсказок пользователю\n\n## Автоматическое использование\n\n**Важно:** При создании отправлений через POST `/postal-deliveries` система\nавтоматически валидирует данные согласно правилам для указанной страны получателя.\nРучной вызов этого эндпоинта обычно не требуется.\n\n## Примеры использования\n\n### Получение правил для Беларуси\n```\nGET /postal-deliveries/validation/BY\n```\n\n### Получение правил для России\n```\nGET /postal-deliveries/validation/RU\n```\n\n### Получение правил для конкретного региона\n```\nGET /postal-deliveries/validation/RU-LEN\n```\n"
      parameters:
        -
          name: countryCode
          in: path
          description: 'Код страны, капсом. обычно это 2 буквы (BY для Беларуси), но может быть до 6 символов (например RU-LEN в данном роуте валидный кантрикод)'
          required: true
          explode: false
          schema:
            type: string
          example: BY
      responses:
        200:
          description: 'Успешный ответ'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postal_delivery_country_response'
        401:
          description: 'требуется аутентификация (не передан токен или передан не валидный)'
          content:
            application/json:
              example:
                error: Unauthenticated.
  /postal-deliveries/countries:
    get:
      summary: 'Получение списка доступных стран (Бизнес API)'
      description: "Позволяет получить список стран, в которые осуществляется отправка почтовых отправлений.\n\n## Назначение\n\nЭтот эндпоинт используется для получения актуального списка стран, доступных\nдля отправки почтовых отправлений через API Белпочты.\n\n## Использование\n\n### В бизнес-приложениях\n- Отображение списка доступных стран в интерфейсе\n- Валидация выбранной страны перед отправкой\n- Динамическое обновление списка стран\n\n### В адресном виджете\n- Предоставление списка доступных стран для выбора\n- Автоматическое определение правил валидации для выбранной страны\n\n## Структура ответа\n\nКаждая страна содержит:\n- `id` - уникальный идентификатор страны\n- `code` - код страны (например, \"BY\", \"RU\")\n- `names` - названия страны на разных языках\n- `name` - основное название страны\n\n## Примеры использования\n\n### Получение списка всех стран\n```\nGET /postal-deliveries/countries\n```\n\n### Использование в адресном виджете\nПосле получения списка стран, виджет может:\n1. Отобразить список для выбора пользователем\n2. Автоматически применить правила валидации для выбранной страны\n3. Показать соответствующие поля для заполнения адреса\n"
      responses:
        200:
          description: 'Список стран'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postal_delivery_country_list_response'
  /postal-deliveries/hs-codes/list:
    get:
      summary: 'Получение кодов ТН ВЭД (Бизнес API)'
      description: "Позволяет получить дерево кодов ТН ВЭД для классификации товаров.\n\n## Назначение\n\nЭтот эндпоинт используется для получения иерархической структуры кодов ТН ВЭД,\nкоторые необходимы для правильного оформления таможенных документов при\nмеждународных отправлениях.\n\n## Использование\n\n### В бизнес-приложениях\n- Классификация товаров согласно международным стандартам\n- Заполнение таможенных деклараций\n- Определение таможенных пошлин и ограничений\n\n### В адресном виджете\n- Предоставление списка доступных кодов для выбора\n- Автоматическое заполнение полей декларации\n\n## Структура ответа\n\nКаждый код ТН ВЭД содержит:\n- `id` - уникальный идентификатор кода\n- `name` - название товарной позиции\n- `code` - код ТН ВЭД (например, \"01\", \"0101\")\n- `children` - дочерние коды (подкатегории)\n\n## Примеры использования\n\n### Получение всех кодов ТН ВЭД\n```\nGET /postal-deliveries/hs-codes/list\n```\n\n### Использование в декларации\nПосле получения кодов ТН ВЭД, система может:\n1. Предоставить пользователю выбор соответствующего кода\n2. Автоматически заполнить поля декларации\n3. Применить соответствующие таможенные правила\n\n## Важные особенности\n\n- Коды ТН ВЭД регулярно обновляются согласно международным стандартам\n- Для международных отправлений указание кода ТН ВЭД является обязательным\n- Неправильный код может привести к задержке или возврату отправления\n"
      responses:
        200:
          description: 'Коды тн вэд найдеы'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      example: 1
                      description: идентифика́тор
                    name:
                      type: string
                      example: 'ЖИВЫЕ ЖИВОТНЫЕ'
                      description: название
                    code:
                      type: string
                      example: '01'
                      description: 'код кода тн вэд'
                    children:
                      type: array
                      description: 'дети кода тнвэд'
                      example: {  }
                      items:
                        properties:
                          id:
                            type: integer
                            example: 1
                            description: идентифика́тор
                          name:
                            type: string
                            example: 'ЖИВЫЕ ЖИВОТНЫЕ'
                            description: название
                          code:
                            type: string
                            example: '01'
                            description: 'код кода тн вэд'
                          children:
                            description: 'дети кода тнвэд'
                            example: {  }
  '/postal-deliveries/{order_id}/{label_name}':
    get:
      summary: 'Получение бланка отправления (Бизнес API)'
      description: "Позволяет получить бланк подготовленного почтового отправления в формате PDF.\n\n## Назначение\n\nЭтот эндпоинт используется для получения готовых бланков и этикеток,\nкоторые необходимы для оформления и отправки почтовых отправлений.\n\n## Использование\n\n### В бизнес-приложениях\n- Печать этикеток для отправлений\n- Генерация сопроводительных документов\n- Создание архивных копий документов\n\n### Типы доступных бланков\n\n#### Адресные этикетки\n- `address_label_regular` - обычная адресная этикетка\n- `address_label_large` - большая адресная этикетка\n- `address_label_cash_on_delivery_regular` - этикетка с наложенным платежом (обычная)\n- `address_label_cash_on_delivery_large` - этикетка с наложенным платежом (большая)\n\n#### EMS документы\n- `ems_regular` - обычная EMS этикетка\n- `ems_large` - большая EMS этикетка\n- `cn23ems_regular` - таможенная декларация CN23 для EMS\n\n#### Другие документы\n- `cn07_regular` - таможенная декларация CN07\n- `cp72_regular` - сопроводительный документ CP72\n\n## Примеры использования\n\n### Получение обычной адресной этикетки\n```\nGET /postal-deliveries/12345/address_label_regular\n```\n\n### Получение EMS этикетки\n```\nGET /postal-deliveries/12345/ems_regular\n```\n\n### Получение таможенной декларации\n```\nGET /postal-deliveries/12345/cn23ems_regular\n```\n\n## Важные особенности\n\n- Все бланки генерируются в формате PDF\n- Размер файла зависит от типа бланка и содержимого\n- Бланки содержат всю необходимую информацию для отправки\n- Рекомендуется сохранять бланки для архивирования\n"
      parameters:
        -
          name: order_id
          in: path
          description: 'идентифика́тор отправления'
          required: true
          explode: false
          schema:
            type: integer
          example:
            order_id: 21
        -
          name: label_name
          in: path
          description: 'имя бланка'
          required: true
          explode: false
          schema:
            type: string
            enum:
              - address_label_regular
              - address_label_large
              - address_label_cash_on_delivery_regular
              - address_label_cash_on_delivery_large
              - ems_regular
              - ems_large
              - cn23ems_regular
              - cn07_regular
              - cp72_regular
          example:
            label_name: ems_regular
      responses:
        200:
          description: 'отображения бланка'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
              description: 'заголовок успешного ответа пдф'
              example: 'inline; filename="{s10code}_{size}.pdf"'
  /postal-deliveries:
    post:
      summary: 'Создание почтового отправления (Бизнес API)'
      description: "Создает новое почтовое отправление с автоматической валидацией контактов.\n\n## Автоматическая валидация\n\nСистема автоматически валидирует данные отправителя и получателя согласно правилам для указанной страны.\n\n## Новые поля для адресного виджета\n\n### `sender_contact_widget_data` и `recipient_contact_widget_data`\nПозволяют использовать новый адресный виджет вместо устаревших полей `sender` и `recipient`.\n\n**Важно:** Используйте либо новые поля виджета, либо устаревшие поля, но не оба одновременно.\n\n### `sender_payment_info`\nДополнительные данные для реквизитов отправителя (для юридических лиц и ИП).\n\n## Правила валидации адресов\n\n### Республиканские адреса (BY)\n**Обязательные поля:**\n- `country_code` - код страны (всегда \"BY\")\n- `id` - идентификатор адреса из справочника (получается через `/api/v2/business/geo-directory/dictionary`)\n- `type` - тип адреса (address, on_demand, subscriber_box)\n- `house` - номер дома\n\n**Опциональные поля:**\n- `block` - корпус\n- `flat` - квартира\n- `postcode`, `region`, `district`, `city_type`, `city`, `street_type`, `street`\n- `cell_number`, `floor`, `entrance`, `door_code`\n- `latitude`, `longitude`, `full_address`\n\n**Примечание:** Идентификатор `id` адреса получается через endpoints адресного справочника:\n- `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=...`\n- `GET /api/v2/business/geo-directory/dictionary/{id}`\n\n### Международные адреса (другие страны)\n**Обязательные поля:**\n- `country_code` - код страны (например, \"RU\")\n- `postcode` - почтовый индекс\n- `city` - название города\n- `address_line` - адресная строка\n\n## Правила валидации контактных данных (person)\n\n### Для отправителя (всегда BY)\n**Обязательные поля:**\n- `type` - тип контакта (individual, legal, individual_entrepreneur)\n- `first_name`, `last_name` - для individual\n- `organization_name` - для legal и individual_entrepreneur\n\n**Опциональные поля:**\n- `second_name`, `email`, `phone` - не обязательные для всех типов\n\n### Для получателя (зависит от страны)\n**Обязательные поля:**\n- `type` - тип контакта (individual, legal, individual_entrepreneur)\n- `first_name`, `last_name` - для individual\n- `organization_name` - для legal и individual_entrepreneur\n\n**Опциональные поля:**\n- `second_name`, `email`, `phone` - не обязательные для всех типов\n\n## Важные особенности логики работы\n\n### Отправитель (sender_contact_widget_data)\n- **Всегда валидируется как BY**\n- **Применяются только республиканские правила** валидации\n- **Обязательные поля:** `country_code` (BY), `id`, `type`, `house`\n- **Опциональные поля:** `block`, `flat`\n\n### Получатель (recipient_contact_widget_data)\n- **Страна определяется из поля `country_code`** в данных получателя\n- **BY** - республиканские правила (обязательные: country_code, id, type, house; опциональные: block, flat)\n- **Другие страны** - международные правила (обязательные: country_code, postcode, city, address_line)\n\n## Поддерживаемые типы отправлений\n- `package` - посылка\n- `ems` - экспресс-почта\n- `small_package` - мелкий пакет\n- `small_valued_package` - мелкий пакет с объявленной ценностью\n\n## Поддерживаемые типы вложений\n- `documents` - документы\n- `products` - товары\n\n## Миграция с устаревшего API\n\n### Старый формат (устаревший):\n```json\n{\n  \"sender\": {\n    \"type\": \"natural_person\",\n    \"info\": { \"first_name\": \"John\", \"last_name\": \"Doe\" },\n    \"location\": { \"country_code\": \"BY\", \"house\": \"1\" }\n  },\n  \"recipient\": {\n    \"type\": \"natural_person\",\n    \"info\": { \"first_name\": \"Jane\", \"last_name\": \"Smith\" },\n    \"location\": { \"country_code\": \"RU\", \"city\": \"Moscow\" }\n  }\n}\n```\n\n### Новый формат с виджетом:\n```json\n{\n  \"sender_contact_widget_data\": {\n    \"person\": { \"type\": \"individual\", \"first_name\": \"John\", \"last_name\": \"Doe\" },\n    \"address\": { \"id\": 12345, \"type\": \"address\", \"country_code\": \"BY\", \"house\": \"1\", \"block\": \"1\", \"flat\": \"15\" }\n  },\n  \"recipient_contact_widget_data\": {\n    \"person\": { \"type\": \"individual\", \"first_name\": \"Jane\", \"last_name\": \"Smith\" },\n    \"address\": { \"country_code\": \"RU\", \"postcode\": \"101000\", \"city\": \"Moscow\", \"address_line\": \"ул. Ленина, д. 1\" }\n  }\n}\n```\n\n**Преимущества нового формата:**\n- Автоматическая валидация через виджет контактов\n- Поддержка международных адресов\n- Единообразная структура данных\n- Лучшая обработка ошибок\n\n## Получение адресов из справочника\n\nПеред созданием отправления с адресом получателя в Беларуси (BY) необходимо:\n1. Найти адрес через адресный справочник: `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=...`\n2. Получить идентификатор `id` из результата поиска\n3. Использовать этот `id` в поле `address.id` при создании отправления\n\nДля получения детальной информации об адресе используйте:\n- `GET /api/v2/business/geo-directory/dictionary/{id}` - получение адреса по ID\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/postal_delivery_store_request'
      responses:
        200:
          description: 'Successful response'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/postal_delivery_store_response'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    postal_delivery_country_response:
      properties:
        id:
          type: integer
          description: 'идентифика́тор страны'
        name_ru:
          type: string
          description: 'Название страны на русском языке'
        name_en:
          type: string
          description: 'Название страны на английском языке'
        document:
          type: object
          description: 'Тип правила "документ"'
          properties:
            ems:
              type: object
              description: 'Правила для ems'
              properties:
                regular:
                  type: object
                  description: 'правила для обычных посылок с типом ems'
                  properties:
                    maxWeight:
                      type: integer
                      example: 2000
                      description: 'максимальный вес'
                    declareValue:
                      type: object
                      description: 'объявленная ценность'
                      properties:
                        min:
                          type: number
                          example: 0.2
                          description: 'минимальная цена'
                        min_with_cash_on_delivery:
                          type: number
                          example: 1
                          description: 'минимальная цена с наложенным платежем'
                        max:
                          type: number
                          example: 431.78
                          description: 'максимальная цена'
                    cashOnDelivery:
                      type: object
                      description: 'наложеный платеж'
                      properties:
                        min:
                          type: number
                          example: 0.2
                        max:
                          type: number
                          example: 10
                    simple_notification:
                      type: boolean
                      description: 'Поддерживает ли уведомление о вручении простое'
                    sms_notification:
                      type: boolean
                      description: 'Поддерживает ли уведомление о вручении по смс'
                    email_notification:
                      type: boolean
                      description: 'Поддерживает ли уведомление о вручении по email'
                priority:
                  type: object
                  description: 'правила для приоритетных посылок с типом ems'
                  properties:
                    maxWeight:
                      type: integer
                      example: 0
                      description: 'максимальный вес'
                    declareValue:
                      type: object
                      description: 'объявленная ценность'
                      properties:
                        min:
                          type: number
                          example: 0
                          description: 'минимальная цена'
