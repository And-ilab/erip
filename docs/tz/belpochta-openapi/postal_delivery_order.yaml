    InternationalAddressDTO:
      type: object
      description: "Международный адрес (country_code != BY).\n\n## Обязательные поля\n\n- `country_code` - код страны (например, \"RU\", \"US\")\n- `postcode` - почтовый индекс\n- `city` - название города\n- `address_line` - адресная строка\n\n## Опциональные поля\n\n- `flat` - номер квартиры/офиса\n- `latitude`, `longitude` - координаты\n- `full_address` - полный адрес в текстовом виде\n\n## Автоматическая валидация\n\nСистема автоматически валидирует международные адреса согласно правилам для указанной страны.\n\n## Использование в адресном виджете\n\nВиджет использует правила валидации для:\n- Определения обязательных полей для конкретной страны\n- Валидации введенных данных согласно международным стандартам\n- Отображения подсказок на соответствующем языке\n\n## Особенности международных адресов\n\n- Структура адреса может отличаться в зависимости от страны\n- Некоторые страны требуют дополнительные поля\n- Рекомендуется использовать `full_address` для сложных адресов\n"
      properties:
        postcode:
          type: string
        country_code:
          type: string
          not:
            enum:
              - BY
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        city:
          type: string
        flat:
          type: string
          nullable: true
        address_line:
          type: string
          nullable: true
        full_address:
          type: string
