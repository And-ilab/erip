    ContactDTO:
      type: object
      description: "Схема контактных данных для адресного виджета.\n\n## Структура\n\n- `person` - персональные данные контакта\n- `address` - адресные данные (один из типов адресов)\n\n## Автоматическое обогащение адреса (BY)\n\nПри передаче `id` из геосправочника для адресов BY достаточно отправить\nтолько пользовательские данные. Остальные поля (`postcode`, `region`, `district`,\n`city`, `city_type`, `street`, `street_type`) обогащаются автоматически по `id`.\n\n**Минимальный адрес BY:**\n```json\n{\n  \"id\": 12345, \"type\": \"address\", \"country_code\": \"BY\",\n  \"house\": \"10\", \"block\": \"1\", \"flat\": \"15\"\n}\n```\n\n## Типы адресов\n\n### Республиканские адреса (BY)\n- `RepublicAddressDTO` - обычный адрес (`type: address`)\n- `RepublicOnDemandAddressDTO` - до востребования (`type: on_demand`)\n- `RepublicSubscriberBoxAddressDTO` - абонентский ящик (`type: subscriber_box`)\n\n### Международные адреса\n- `InternationalAddressDTO` - адрес для других стран (обязательны: `country_code`, `postcode`, `city`, `address_line`)\n\n## Получение идентификатора адреса\n\nДля адресов BY идентификатор `id` получается через геосправочник:\n- `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=...`\n- `GET /api/v2/business/geo-directory/dictionary/{id}`\n"
      properties:
        address:
          oneOf:
            -
              $ref: '#/components/schemas/RepublicAddressDTO'
            -
              $ref: '#/components/schemas/RepublicOnDemandAddressDTO'
            -
              $ref: '#/components/schemas/RepublicSubscriberBoxAddressDTO'
            -
              $ref: '#/components/schemas/InternationalAddressDTO'
        person:
          $ref: '#/components/schemas/PersonDTO'
    PersonDTO:
      type: object
      discriminator:
        propertyName: type
        mapping:
          legal: '#/components/schemas/LegalPersonDTO'
          individual: '#/components/schemas/IndividualPersonDTO'
          individual_entrepreneur: '#/components/schemas/IndividualEntrepreneurPersonDTO'
      oneOf:
        -
          $ref: '#/components/schemas/LegalPersonDTO'
        -
          $ref: '#/components/schemas/IndividualPersonDTO'
        -
          $ref: '#/components/schemas/IndividualEntrepreneurPersonDTO'
    LegalPersonDTO:
      type: object
      properties:
        type:
          type: string
          enum:
            - legal
        organization_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
    IndividualPersonDTO:
      type: object
      properties:
        type:
          type: string
          enum:
            - individual
        first_name:
          type: string
        last_name:
          type: string
        second_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
    IndividualEntrepreneurPersonDTO:
      type: object
      properties:
        type:
          type: string
          enum:
            - individual_entrepreneur
        organization_name:
          type: string
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
    RepublicAddressDTO:
      type: object
      description: "Республиканский адрес (BY), тип address.\n\n## Минимальный набор полей\n\nПри передаче `id` из геосправочника достаточно отправить только те поля,\nкоторые не содержатся в справочнике (пользовательские данные):\n\n| Поле | Обязательность | Описание |\n|------|---------------|----------|\n| `id` | **обязательное** | Идентификатор адреса из геосправочника |\n| `type` | **обязательное** | Тип адреса (`address`, `on_demand`, `subscriber_box`) |\n| `country_code` | **обязательное** | Код страны (всегда `BY`) |\n| `house` | **обязательное** | Номер дома |\n| `block` | опциональное | Корпус |\n| `flat` | опциональное | Квартира |\n\nОстальные поля (`postcode`, `region`, `district`, `city`, `city_type`, `street`, `street_type` и др.)\n**автоматически обогащаются** из геосправочника по переданному `id`.\nИх можно не передавать.\n\n## Получение идентификатора адреса\n\nИдентификатор `id` получается через адресный справочник:\n- `GET /api/v2/business/geo-directory/dictionary?name=address&type=address&search=...` - поиск адресов\n- `GET /api/v2/business/geo-directory/dictionary/{id}` - получение конкретного адреса по ID\n\n## Минимальный пример\n\n```json\n{\n  \"id\": 12345,\n  \"type\": \"address\",\n  \"country_code\": \"BY\",\n  \"house\": \"10\",\n  \"block\": \"1\",\n  \"flat\": \"15\"\n}\n```\n"
      required:
        - id
        - type
        - country_code
        - house
      properties:
        id:
          type: integer
          description: 'Идентификатор адреса из геосправочника'
          example: 12345
        type:
          type: string
          enum:
            - address
          description: 'Тип адреса'
        country_code:
          type: string
          enum:
            - BY
          description: 'Код страны'
        house:
          type: string
          description: 'Номер дома'
          example: '10'
        block:
          type: string
          nullable: true
          description: Корпус
          example: '1'
        flat:
          type: string
          nullable: true
          description: Квартира
          example: '15'
        postcode:
          type: string
          nullable: true
          description: 'Почтовый индекс (обогащается из справочника по id)'
        region:
          type: string
          nullable: true
          description: 'Область (обогащается из справочника по id)'
        district:
          type: string
          nullable: true
          description: 'Район (обогащается из справочника по id)'
        city_type:
          type: string
          nullable: true
          description: 'Тип населённого пункта (обогащается из справочника по id)'
        city:
          type: string
          nullable: true
          description: 'Населённый пункт (обогащается из справочника по id)'
        street_type:
          type: string
          nullable: true
          description: 'Тип улицы (обогащается из справочника по id)'
        street:
          type: string
          nullable: true
          description: 'Улица (обогащается из справочника по id)'
        cell_number:
          type: string
          nullable: true
        full_address:
          type: string
          nullable: true
          description: 'Полный адрес (обогащается из справочника по id)'
        floor:
          type: string
          nullable: true
        entrance:
          type: string
          nullable: true
        door_code:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
